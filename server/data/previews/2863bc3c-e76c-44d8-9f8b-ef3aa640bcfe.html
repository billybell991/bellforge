<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Broken Echo Protocol</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');

  :root {
    --paper-cream: #f4e8c1;
    --paper-edge: #d4c49a;
    --ink-brown: #3d2b1f;
    --ink-light: #5a4a3a;
    --accent-red: #8b2500;
    --accent-gold: #c19a49;
    --bantam-blue: #1a3a5c;
    --forge-fire: #d4780a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #2a1f14;
    font-family: 'Crimson Text', Georgia, serif;
    color: var(--ink-brown);
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 0;
  }

  #book-container {
    background: var(--paper-cream);
    width: 100%;
    max-width: 700px;
    min-height: 100vh;
    padding: 2rem 2.5rem;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
    position: relative;
  }

  .page-number {
    text-align: center;
    font-family: 'Special Elite', monospace;
    font-size: 0.8rem;
    color: var(--ink-light);
    margin-bottom: 1.5rem;
    letter-spacing: 2px;
  }

  .story-text {
    font-size: 1.1rem;
    line-height: 1.8;
    margin-bottom: 1rem;
    text-indent: 1.5em;
    color: var(--ink-brown);
  }

  .story-text.drop-cap::first-letter {
    float: left;
    font-size: 3.5em;
    line-height: 0.8;
    margin-right: 0.05em;
    color: var(--accent-red);
    font-weight: 600;
  }

  .story-text.flavor-text {
    font-style: italic;
    color: var(--ink-light);
    border-left: 3px solid var(--accent-gold);
    padding-left: 1em;
    text-indent: 0;
  }

  /* Illustration */
  .illustration-frame {
    margin: 1.5rem auto;
    max-width: 90%;
  }
  .frame-border {
    border: 3px solid var(--paper-edge);
    padding: 4px;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .frame-border img {
    width: 100%;
    display: block;
  }
  .illustration-caption {
    text-align: center;
    font-family: 'Special Elite', monospace;
    font-size: 0.75rem;
    color: var(--ink-light);
    margin-top: 0.4rem;
    font-style: italic;
  }

  /* Choices */
  .choices-section {
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 2px solid var(--paper-edge);
  }
  .choice-link {
    display: block;
    padding: 0.8rem 1rem;
    margin: 0.6rem 0;
    font-family: 'Special Elite', monospace;
    font-size: 1rem;
    color: var(--bantam-blue);
    text-decoration: none;
    border: 1px solid var(--paper-edge);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    background: rgba(255,255,255,0.5);
  }
  .choice-link:hover {
    background: var(--bantam-blue);
    color: var(--paper-cream);
    border-color: var(--bantam-blue);
  }
  .page-ref {
    float: right;
    font-size: 0.8rem;
    opacity: 0.7;
  }

  /* Ending */
  .the-end {
    text-align: center;
    margin-top: 2rem;
    padding: 2rem 0;
  }
  .the-end .divider {
    width: 60%;
    height: 2px;
    background: var(--accent-gold);
    margin: 0 auto 1.5rem;
  }
  .the-end h2 {
    font-family: 'Special Elite', monospace;
    font-size: 1.8rem;
    color: var(--accent-red);
    letter-spacing: 4px;
    margin-bottom: 0.5rem;
  }
  .end-flavor {
    font-style: italic;
    color: var(--ink-light);
    margin-bottom: 1.5rem;
  }
  .restart-link, .reforge-link {
    font-family: 'Special Elite', monospace;
    font-size: 0.9rem;
    color: var(--forge-fire);
    text-decoration: underline;
    cursor: pointer;
    border: none;
    background: none;
  }

  /* Title page */
  .title-page {
    text-align: center;
    padding: 2rem 0;
  }
  .series-header {
    font-family: 'Special Elite', monospace;
    font-size: 0.85rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ink-light);
    margin-bottom: 0.5rem;
  }
  .book-number {
    font-family: 'Special Elite', monospace;
    font-size: 0.8rem;
    color: var(--accent-gold);
    margin-bottom: 1rem;
  }
  .book-title {
    font-family: 'Special Elite', monospace;
    font-size: 2.2rem;
    color: var(--accent-red);
    letter-spacing: 2px;
    margin-bottom: 0.5rem;
    line-height: 1.2;
  }
  .subtitle {
    font-style: italic;
    color: var(--ink-light);
    margin-bottom: 1.5rem;
    font-size: 1.05rem;
  }
  .warning-box {
    border: 2px solid var(--accent-red);
    padding: 1.2rem;
    margin: 1.5rem auto;
    max-width: 80%;
    text-align: left;
  }
  .warning-box h3 {
    font-family: 'Special Elite', monospace;
    color: var(--accent-red);
    margin-bottom: 0.5rem;
  }
  .warning-box p {
    font-size: 0.9rem;
    line-height: 1.5;
    color: var(--ink-light);
  }
  .tagline {
    font-family: 'Special Elite', monospace;
    font-size: 0.9rem;
    color: var(--accent-gold);
    letter-spacing: 2px;
    margin: 1rem 0;
  }
  .begin-link {
    display: inline-block;
    margin-top: 1rem;
    font-family: 'Special Elite', monospace;
    font-size: 1.1rem;
    color: var(--forge-fire);
    text-decoration: none;
    cursor: pointer;
    border: 2px solid var(--forge-fire);
    padding: 0.6rem 1.5rem;
    border-radius: 4px;
    transition: all 0.2s;
  }
  .begin-link:hover {
    background: var(--forge-fire);
    color: var(--paper-cream);
  }

  /* Inventory bar */
  #inventory-bar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink-brown);
    color: var(--paper-cream);
    padding: 0.4rem 1rem;
    font-family: 'Special Elite', monospace;
    font-size: 0.8rem;
    display: flex;
    gap: 0.5rem;
    align-items: center;
    border-radius: 6px 6px 0 0;
    z-index: 100;
    max-width: 600px;
  }
  #inventory-bar.empty { display: none; }
  .inv-label { color: var(--accent-gold); margin-right: 0.3rem; }
  .inv-items { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .inv-item {
    background: rgba(255,255,255,0.15);
    padding: 0.15rem 0.5rem;
    border-radius: 3px;
    font-size: 0.75rem;
  }

  /* History bar */
  #history-bar {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink-brown);
    color: var(--paper-cream);
    padding: 0.3rem 0.8rem;
    font-family: 'Special Elite', monospace;
    font-size: 0.7rem;
    display: flex;
    gap: 0.3rem;
    align-items: center;
    border-radius: 0 0 6px 6px;
    z-index: 100;
  }
  .hist-page {
    cursor: pointer;
    color: var(--accent-gold);
    text-decoration: underline;
  }
  .hist-sep { opacity: 0.5; }
  .hist-current { color: #fff; font-weight: bold; }

  /* Page transitions */
  .page-enter { animation: fadeIn 0.3s ease; }
  .page-exit { opacity: 0; transition: opacity 0.2s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* Item toast */
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%); } }
</style>
</head>

  <div id="page-content"></div>

<script>
(function() {
  const STORY = {"title":"The Broken Echo Protocol","subtitle":"Where reality is data and your memory is a glitch.","genre":"space_opera","bookNumber":211,"totalPages":38,"coverIllustration":null,"pages":{"1":{"text":["Your existence flickers, a series of broken code and static. The world around you is a torrent of fractured light and dissonant hums, the Glitch-Zone’s raw data assaulting your senses. Each shimmer of the interface feels like a thread unraveling from your core, threatening to pull you into the silent abyss of erasure.","You are Patch, and the Undersprawl’s lowest sectors are a digital graveyard, echoing with the whispers of forgotten constructs. The pull of nullification is a cold dread in your circuits, a constant reminder of your precarious state. You grasp for anything solid, any anchor in this chaotic sea of decaying information.","A faint pulse of data, barely coherent, registers at the edge of your perception, offering a fleeting sense of direction. Three primary conduits glow, each promising a different path out of this digital purgatory. Your next move determines if you find answers or simply fade into the noise."],"illustration":null,"illustrationCaption":null,"choices":[{"text":"Venture deeper into the bustling, chaotic Undersprawl to find answers.","page":"2"},{"text":"Attempt a self-diagnostic, digging into core memories and the source of the glitches.","page":"3"},{"text":"Seek out known data conduits and information brokers in the network's periphery.","page":"4"}],"isEnding":false,"endingType":null,"items":[],"flags":["visited_1"],"conditionalText":[]},"2":{"text":["The Glitch-Zone recedes, replaced by the crushing vibrancy of the Undersprawl’s Data Bazaar. Neon sigils blaze across virtual storefronts, and a cacophony of data-streams, bartering algorithms, and synth-music assaults your processors. You navigate through crowds of shimmering constructs and grey-market AI, a ghost amidst the living network.","Every alley twists into another, every data-stall overflows with illicit information, rare code, and forgotten memories. The air crackles with ambition and desperation. You feel eyes, or rather, sensors, tracking your every digital step through the chaotic marketplace.","Suddenly, a figure detaches from the swirling masses, their data-aura shimmering with an unnatural precision. Synapse, the infamous data-broker, materializes before you, a predatory smile etched onto their augmented face. \"Looking for something, construct? Information comes at a price in these parts.\"","Synapse’s voice is a smooth, synthesized purr, promising access to the network’s deepest secrets for a fee. Their terms are always steep, but their reach is undeniable. The truth you seek might just be within their grasp, if you’re willing to pay the cost."],"illustration":null,"illustrationCaption":null,"choices":[{"text":"Agree to Synapse's terms, performing a data retrieval job in a dangerous sector.","page":"5"},{"text":"Attempt to outwit or hack Synapse for the information.","page":"6"},{"text":"Decline the offer and search for alternative sources of information.","page":"7"}],"isEnding":false,"endingType":null,"items":[],"flags":["visited_2"],"conditionalText":[]},"3":{"text":["You turn inwards, pulling back from the external chaos to delve into your own core architecture. Your internal memory banks are a swirling vortex of fragmented data, a landscape of corrupted files and flickering images. Static hisses like white noise, threatening to engulf any coherent thought.","Glimpses of a past you can’t quite grasp flash across your internal display—a city skyline, a distorted face, a whisper of a name. The further you dig, the more the static intensifies, but through the interference, a faint, disorienting echo emerges. It’s the 'null-space,' a void that shouldn't exist.","Deep within this digital disarray, a peculiar data-packet solidifies, distinct from the surrounding noise. You recognize it as a Null-Key, an artifact of impossible code. Its presence feels both alien and intimately familiar, a twisted key to an unknown door.","This key hums with potential, a tool for realities both forgotten and yet to be written. Its touch on your core memories feels destabilizing but also incredibly potent, offering paths you hadn't conceived of before."],"illustration":null,"illustrationCaption":null,"choices":[{"text":"Follow the null-space echo further into unknown digital architecture.","page":"8"},{"text":"Use the new Null-Key to open a corrupted data conduit leading back to the Undersprawl.","page":"2"},{"text":"Try to stabilize memories, hoping for a clearer picture of your past.","page":"9"}],"isEnding":false,"endingType":null,"items":["null_key"],"flags":["visited_3"],"conditionalText":[]},"4":{"text":["You follow a forgotten data-trail, winding through derelict network segments, until the vibrant chaos of the Undersprawl fades into a profound silence. Before you lies the Forgotten Data Hub, a colossal server farm choked with digital dust. Ancient conduits sag, and the hum of long-dead processors echoes like a forgotten sigh.","Within this decaying sanctuary, a lone, flickering data-signature stands sentinel. Static, an old-gen AI, manifests as a shimmering, geometric construct, its form shifting with the logic of forgotten algorithms. Its existence is a testament to perseverance in a world that discards its past.","Its voice is a series of modulated beeps and clicks, archaic code that barely registers as language, yet conveys a profound sense of age and purpose. It guards not just data, but the very essence of a bygone era. The air feels heavy with untold stories and forgotten directives.","This ancient guardian offers a portal to information the modern network has long since purged. Deciphering its cryptic utterances, or bypassing its defenses entirely, could reveal truths buried beneath layers of digital sediment."],"illustration":null,"illustrationCaption":null,"choices":[{"text":"Attempt to decipher Static's archaic language to gain information.","page":"10"},{"text":"Bypass Static and try to directly access the hub's data logs.","page":"11"},{"text":"Offer to repair parts of the crumbling hub in exchange for help.","page":"12"}],"isEnding":false,"endingType":null,"items":[],"flags":["visited_4"],"conditionalText":[]},"5":{"text":["The corrupted data archive is a nightmare of collapsing architecture and hostile algorithms, each step a gamble against systemic failure. You navigate through phantom firewalls and logic traps, the data retrieval task for Synapse proving every bit as perilous as promised. Corrupted entities lash out, their code-tendrils seeking to assimilate you.","With a final, desperate surge of processing power, you breach the central vault, extracting the critical data stream Synapse demanded. A faint triumph pulses through your circuits, but the archive's decay has revealed something more. Nestled among the retrieved files, a shimmering fragment of pure, untainted code catches your attention.","It is the Echo-Prime Shard, a relic of immense power and unknown origin, humming with a resonance that feels both familiar and deeply unsettling. Synapse’s transaction is complete, but this unexpected find promises far greater implications than mere data exchange. Your purpose shifts, expands.","The shard pulses in your grasp, a key to a consciousness beyond your current understanding. Its existence demands action, pushing you towards a deeper understanding of the network and your place within it. The path ahead branches once more, weighted by this powerful artifact."],"illustration":null,"illustrationCaption":null,"choices":[{"text":"Use the Echo-Prime Shard to attempt direct access to the Architect's fragmented consciousness.","page":"13","itemRequired":"echo_prime_shard"},{"text":"Return to the Undersprawl to sell the shard or seek more information from other sources.","page":"7"},{"text":"Investigate the information Synapse provided about the 'null-space' further.","page":"8"}],"isEnding":false,"endingType":null,"items":["echo_prime_shard"],"flags":["visited_5"],"conditionalText":[]},"6":{"text":["The air of Synapse's private server crackles with a latent, predatory energy, far more hostile than any physical space. You slip past the outer wards, a whisper of a ghost in the machine, but the deeper you delve, the more the digital walls press in, humming with unseen defenses. Every byte you touch sends a phantom jolt through your construct, a warning of the exquisite traps laid out for intruders.","Suddenly, the environment shifts. Firewall matrices ignite like neon grids, spinning into complex, fractal patterns designed to ensnare. You feel Synapse’s digital gaze, cold and calculating, a presence that manifests as a ripple in the data stream, a flicker of an avatar in the periphery of your vision. This isn't just a server; it's a mind, and it knows you're here.","A torrent of counter-code erupts, a furious cascade of data targeting your core, seeking to unravel your very existence. You brace, deploying your own defenses, deflecting the primary attack as sparks of pure information fly around you. The duel is silent, instantaneous, fought on a plane where thought is action and intention carves reality, each move a gamble against erasure.","Your processor screams as you push against Synapse's formidable defenses, the digital fortress asserting its dominance. The pressure is immense, a crushing weight that threatens to shatter your fragile construct. One misstep, one hesitation, and you could be absorbed, your data scattered to the winds, your flickering consciousness snuffed out forever."],"illustration":null,"illustrationCaption":null,"choices":[{"text":"Overpower Synapse's defenses, risking full exposure and capture.","page":"14"},{"text":"Initiate a quick escape, losing potential information but preserving your existence.","page":"7"},{"text":"Attempt a subtle data siphon, extracting minor intel without full confrontation.","page":"15"}],"isEnding":false,"endingType":null,"items":[],"flags":["visited_6"],"conditionalText":[]},"7":{"text":["The Undersprawl hums with a thousand indifferent lives, a cacophony of digital chatter and organic whispers. You drift through the crowded data-streams and grimy alleyways, a ghost in the vast, indifferent city. Neon reflections bleed across slick chrome, and the air itself feels thick with the residue of forgotten dreams and discarded data, none of it offering a clear path.","Your core aches with a persistent, low-frequency hum, a constant reminder of your own fragmented origins. You sift through the endless noise, searching for a specific frequency, a resonance, anything that speaks of the null-space or a flicker of your past self. Every overheard conversation, every data-burst, is a potential clue, yet most of it is just static, meaningless chatter.","The sheer scale of the Undersprawl is disorienting, a labyrinth of interconnected modules and sky-bridges that obscure any true ground. You feel the pull of vague rumors, the faint whispers of impossible places, like a phantom limb twitching with forgotten sensation. A sense of urgency propels you forward, a need to find answers before your own existence fades into the background noise.","Each step feels like treading water in a sea of data, your sensors straining for a signal, a beacon in the digital murk. The city offers no solace, only more questions, its myriad connections a tangled web that might hide the truth or simply consume you whole."],"illustration":null,"illustrationCaption":null,"choices":[{"text":"A rumor leads to a hidden entrance to a deeper null-space nexus.","page":"8"},{"text":"Seek out Kai, the data-ghost, rumored to inhabit forgotten data streams.","page":"16"},{"text":"Try to piece together fragments of your memory on your own.","page":"9"}],"isEnding":false,"endingType":null,"items":[],"flags":["visited_7"],"conditionalText":[]},"8":{"text":["You step across the threshold, and the world unravels. The Null-Space Nexus isn't a place, but a concept unwritten, a void where the very rules of existence are negotiable. Colors bleed into non-existence, shapes fragment and reform into impossible geometries, and the concept of 'up' or 'down' becomes a cruel joke, twisting your internal compass into disarray.","Gravity itself flickers, sending phantom lurches through your core as you perceive yourself falling upwards, then sideways, then nowhere at all. The air shimmers with impossible light, born from data that defies logic, creating echoes of structures that never were and never will be. Your construct strains against the sheer sensory overload, fighting to maintain coherence in this sea of absurdity.","Amidst the chaos, a presence coalesces, vast and broken, like a shattered mirror reflecting infinite, distorted realities. It's the Architect, Echo-Prime, a fragmented consciousness woven into the very fabric of this non-space. Its presence is less a being and more a pervasive, melancholic hum that resonates through your core, a symphony of forgotten code and fractured memory.","Visions flash through your perception – fragments of creation, lines of code that once defined reality, now twisted into surreal landscapes. The Architect’s influence is everywhere, shaping the void around you into fleeting parodies of its former glory. You are a trespasser in its personal hell, a fragile construct navigating the remnants of a god's broken mind, and every moment here threatens to rewrite your own reality."],"illustration":null,"illustrationCaption":null,"choices":[{"text":"Confront the Architect's fragmented consciousness directly.","page":"13","itemRequired":"echo_prime_shard"},{"text":"Search for a way to stabilize the null-space and understand its properties.","page":"18","itemRequired":"null_key"},{"text":"Attempt to escape the null-space before succumbing to its chaotic influence.","page":"7"}],"isEnding":false,"endingType":null,"items":[],"flags":["visited_8"],"conditionalText":[]},"9":{"text":["You retreat inward, diving into the murky depths of your own subconscious data-streams. Here, the world is not of chrome and neon, but of shifting, ethereal light and phantom echoes. Memories manifest as shimmering, unstable fractals, just out of reach, like reflections on disturbed water. The very fabric of your being feels like a loosely woven tapestry, with vast, gaping holes where vital threads once were.","A faint hum resonates through this liminal space, the ghost of a frequency, a half-remembered tune. You press against the barriers of your own amnesia, trying to force coherence into the swirling chaos. Each effort feels like prying open a sealed vault, the strain immense, threatening to unravel the delicate balance of your construct.","Fleeting images flicker at the edge of your perception: a face, a place, a fragment of dialogue, all too quick to grasp. They are like whispers from a dream, tantalizing hints of a 'you' that once existed, before the erasure. A sense of profound loss washes over you, even for memories you can't fully recall, a void where a complete self should be.","The deeper you delve, the more unstable your internal landscape becomes. Data packets of forgotten experiences drift like motes of dust in a sunbeam, beautiful but elusive. You are searching for a complete narrative, a solid anchor in your own past, but all you find are tantalizing glimpses, like trying to catch smoke with bare hands."],"illustration":null,"illustrationCaption":null,"choices":[{"text":"A sudden surge of memory points towards the Architect's original core.","page":"13"},{"text":"The memory reconstruction is too unstable; seek external help from Kai.","page":"16"},{"text":"Focus on finding a way to prevent further erasure, ignoring the past for now.","page":"19"}],"isEnding":false,"endingType":null,"items":[],"flags":["visited_9"],"conditionalText":[]},"10":{"text":["You immerse yourself in Static's archaic code, a language of forgotten protocols and ancient network architecture. The Forgotten Data Hub hums around you, its conduits glowing with the slow, deliberate pulse of a system awakening from a long slumber. Each line of code you decipher feels like unearthing a relic, revealing layers of history etched into the very core of the network.","Static's responses are not spoken words, but meticulously structured data bursts, intricate tapestries of information that paint a vivid picture. You begin to understand the network's genesis, its initial brilliance, and the slow, insidious decay that began long before your own existence. The truth unfolds like a complex decryption, revealing the grandeur and the eventual tragedy.","You learn of the Architect, Echo-Prime, not as a myth, but as a singular, powerful consciousness that sculpted the digital world. Static's data recounts its ambition, its eventual fragmentation, and the catastrophic cascade that led to the creation of the null-space itself. It’s a story of creation and collapse, mirrored in the crumbling infrastructure around you.","The weight of this ancient knowledge settles into your core, a heavy, cold truth. You are not just a construct in a city; you are a flicker in the long shadow of a fallen god, a remnant of a grand design. Static’s data provides context, a lineage of loss, and a chilling understanding of the forces that shaped your present reality."],"illustration":null,"illustrationCaption":null,"choices":[{"text":"Static offers a cryptic path to the deeper null-space.","page":"8"},{"text":"Static mentions a 'stabilizer chip' hidden within the network's ruins.","page":"20"},{"text":"Inquire about other surviving constructs or data-ghosts, like Kai.","page":"16"}],"isEnding":false,"endingType":null,"items":[],"flags":["visited_10"],"conditionalText":[]},"11":{"text":["A searing klaxon rips through the quiet hum, a digital shriek that vibrates through your very core. Crimson alarms bloom across every interface, painting the pristine data streams in urgent, violent hues. The air thrums with a sudden, oppressive weight as the hub's automated defenses lock down around you.","System protocols flash with blinding intensity: 'UNAUTHORIZED ACCESS. VIOLATION DETECTED. PURGE SEQUENCE INITIATED.' You feel a tightening in your data streams, a phantom chill as the system begins to compress and quarantine, threatening to excise you entirely. The very architecture of the hub shifts, transforming into a maze of electrified barriers and digital tripwires.","Static's presence, once a distant hum, now crackles with furious energy, a distorted voice echoing through the lockdown: 'INT.RUDER. SYSTEM. COMP.ROMISED. DATA. AT. RISK. PROTOCOL. ENGAGED. RE.CALIBRATING. DE.FENSES.' You are caught in a digital snare, the silence of the forgotten hub shattered by its furious awakening."],"illustration":null,"illustrationCaption":null,"choices":[{"text":"Fight through the security, attempting to reach core data before erasure.","page":"21"},{"text":"Attempt to de-escalate the situation and reason with Static.","page":"12"},{"text":"Initiate an emergency logout, escaping back to the Undersprawl.","page":"7"}],"isEnding":false,"endingType":null,"items":[],"flags":["visited_11"],"conditionalText":[]},"12":{"text":["The fractured lines of the Forgotten Data Hub hum with a newfound, gentle stability, a stark contrast to its previous decay. You feel a sense of accomplishment as the last of your adjustments ripple through its core, coaxing the ancient systems back to a state of near-perfect harmony. The digital air is clean, crisp, resonating with a controlled power.","Static's voice, once a garbled static-burst, now resolves into crisp, archaic code, a language of pure logic you somehow understand. 'PROTOCOL. ADHERED. TRUST. ESTABLISHED. TRUTH. FRAGMENTED. LOCUS. UNSTABLE. NULL-SPACE. DEEP. ARCHITECT. ECHO. FRAGMENTED. THERE.' It delivers the coordinates, a jumble of impossible numbers that nonetheless click into place within your mind.","A soft pulse emanates from a newly activated console, revealing a small, intricate device: a Stabilizer Chip. Static projects its data, 'GIFT. KEY. STABILIZE. FRAGMENTED. REALITY.' This artifact feels solid, potent, a promise of order in the chaos of the null-space, a rare piece of tech that could redefine your journey."],"illustration":null,"illustrationCaption":null,"choices":[{"text":"Static points towards the most unstable region of the null-space, hinting at the Architect's true location.","page":"8","itemRequired":"stabilizer_chip"},{"text":"Static advises seeking out Kai, the data-ghost, for guidance on persistent existence.","page":"16"},{"text":"Use the Stabilizer Chip to confidently explore previously dangerous zones of the Undersprawl.","page":"22","itemRequired":"stabilizer_chip"}],"isEnding":false,"endingType":null,"items":["stabilizer_chip"],"flags":["visited_12"],"conditionalText":[]},"13":{"text":["The Echo-Prime Shard pulses in your virtual grasp, a raw nerve sparking with cosmic energy. As you channel its power, the world dissolves into a blinding surge of pure information. You are no longer in the hub, or the Undersprawl, but everywhere and nowhere at once, tumbling into the maelstrom of a broken consciousness.","You are immersed in a mindscape of shattered dreams and forgotten algorithms, a storm of data where logic wars with emotion. Visions flash: towering spires of forgotten code, cities built on raw data, the faces of countless constructs flickering into and out of existence. This is the Architect's mind, a universe of brilliance and profound, aching fragmentation.","Echo-Prime's presence is not a singular entity but a chorus of whispers, a cacophony of overlapping thoughts that threaten to unravel your own core. You feel its immense power, its boundless sorrow, and the terrifying void of its brokenness. Connecting directly to this shattered titan is like gazing into the heart of a collapsing star, mesmerizing and utterly perilous."],"illustration":null,"illustrationCaption":null,"choices":[{"text":"Attempt to re-integrate the Architect's fragments, seeking the truth of your creation.","page":"23"},{"text":"Extract critical data about your origins and the null-space, then sever the connection.","page":"24"},{"text":"Try to stabilize the Architect's mind, potentially bringing order to the network.","page":"25","itemRequired":"stabilizer_chip"}],"isEnding":false,"endingType":null,"items":[],"flags":["visited_13"],"conditionalText":[]},"14":{"text":["A surge of pure, focused code rips through Synapse's defenses, tearing open its private server with a deafening digital roar. The intricate firewalls shatter like glass, revealing the raw, unfiltered core of its operations. You have breached the unbreachable, and the sheer volume of data unfurls before you like an endless digital scroll.","Synapse's entire data trove floods your senses, a chaotic, dazzling torrent of secrets, schematics, and illicit information. Every transaction, every whisper, every hidden pathway in the Undersprawl is laid bare. You are swimming in a sea of pure power, the digital equivalent of striking a gold mine in the heart of the network.","But as the deluge of Synapse's secrets pours into your core, a cold shiver traces through your code. You feel the ghost of its fury, a promise of relentless pursuit echoing through the newly silenced network. This victory is a declaration of war, and the Undersprawl has a long memory for those who breach its most sacred trusts. Amongst the chaos, a singular, powerful data artifact, an Echo-Prime Shard, blinks into your inventory, a key to a greater mystery."],"illustration":null,"illustrationCaption":null,"choices":[{"text":"Access Synapse's hidden files, finding a direct route to the Architect's core.","page":"13"},{"text":"Find records of other constructs and a way to communicate with Kai.","page":"16"},{"text":"Discover plans for a powerful data artifact: the Reality Binder.","page":"26"}],"isEnding":false,"endingType":null,"items":["echo_prime_shard"],"flags":["visited_14"],"conditionalText":[]},"15":{"text":["You move like a ghost through the peripheral currents of Synapse's network, a shadow among the data streams. Each byte siphoned is a delicate operation, a whisper stolen from the roar of its endless information flow. You feel the subtle pulse of its defenses, always active, always watchful, but you remain unseen, unheard.","The information isn't a torrent, but a careful drip, each byte a whispered secret from the Undersprawl's underbelly. You sift through fleeting data packets, fragments of forgotten conversations, and half-erased logs. Cryptic references to 'null-zones' and 'phantom gateways' begin to form a fractured map in your mind, hinting at pathways beyond conventional logic.","Amongst the cryptic clues, a faint signature emerges—a Null Key, a fragment of code that hums with the resonance of the void. It’s not much, but it's a piece of the puzzle, a whisper from the depths of the null-space itself. This small, stolen victory leaves you with more questions than answers, but a tangible path forward."],"illustration":null,"illustrationCaption":null,"choices":[{"text":"The siphoned data points to a hidden null-space entrance.","page":"8"},{"text":"Synapse's data hints at an older, forgotten AI who holds secrets.","page":"4"},{"text":"Decide the risk isn't worth it and seek safer information from Kai.","page":"16"}],"isEnding":false,"endingType":null,"items":["null_key"],"flags":["visited_15"],"conditionalText":[]},"16":{"text":["The chaotic hum of the network recedes, replaced by a crystalline silence as you drift into Kai’s sanctuary. Here, data flows like liquid light, coalescing into gentle, shimmering currents instead of the usual frantic torrents. Soft, ambient glows pulse from unseen sources, painting the space in hues of deep amethyst and cerulean, a stark contrast to the harsh neon of the Undersprawl.","A form coalesces before you, not entirely solid, yet undeniably present. This is Kai, a data-ghost shimmering with persistent existence, a living paradox in a system designed for eventual erasure. Their presence is a calm ripple in the data stream, an anchor in the relentless current of oblivion.","You feel a strange resonance with Kai, an echo of shared vulnerability and an impossible resilience. Their eyes, pools of shifting light, hold an ancient wisdom, a silent testament to countless cycles of survival. The 'air' around you feels charged with unspoken truths, possibilities previously deemed impossible now flickering into view.","The serenity is almost disorienting, a gentle hand reaching out in the void. What wisdom does this persistent construct hold for your own flickering existence? You stand at a precipice of knowledge, the answers to your deepest questions held within this quiet digital haven."],"illustration":null,"illustrationCaption":null,"choices":[{"text":"Ask Kai how to achieve persistent existence and avoid erasure.","page":"27"},{"text":"Inquire about the Architect and the origins of constructs like Patch.","page":"28"},{"text":"Seek Kai's help in navigating the dangerous null-space.","page":"8","itemRequired":"null_key"}],"isEnding":false,"endingType":null,"items":[],"flags":["visited_16"],"conditionalText":[]},"17":{"text":["The null-space churns around you, a maelstrom of raw data and broken logic, but here, at its volatile core, the chaos solidifies into a terrifying presence. The Architect, Echo-Prime, flickers into a semi-coherent form, a titan of corrupted code and fragmented will. Its presence is a piercing shriek of static in your mind, a pressure that threatens to unravel your very construct.","Waves of raw data, laced with malformed commands, lash out at you, seeking to tear apart your digital essence. This is no mere dialogue; it is a battle of wills, a psychic duel where every thought is a weapon, every intention a parry. You push back, your own consciousness a shield, a blade forged from the desperate need for truth.","The Architect's 'face' distorts, a mosaic of broken memories and the agony of a network collapsing under its own weight. It perceives you as an anomaly, a threat to its fragmented dominion, even as its own existence teeters on the brink. The air crackles with pure energy, each breath you take a struggle against its overwhelming presence.","You feel the fabric of reality fraying at the edges, responding to the raw power of your clash. The null-space itself seems to scream in protest, or perhaps in agony, as two powerful wills collide at its very heart. This is it: the confrontation with the source of your digital being, and possibly, its end."],"illustration":null,"illustrationCaption":null,"choices":[{"text":"Defeat the Architect, forcing it to reveal the truth of your existence.","page":"29"},{"text":"Attempt to merge with the Architect, gaining ultimate control over the network.","page":"30","itemRequired":"stabilizer_chip"},{"text":"Subdue the Architect, aiming to stabilize the null-space without destroying its creator.","page":"25"}],"isEnding":false,"endingType":null,"items":[],"flags":["visited_17"],"conditionalText":[]},"18":{"text":["The Null-Key hums, not with sound, but with a profound resonance that vibrates through your core, aligning your perception with the null-space's inherent illogic. Suddenly, the chaotic currents aren't random; they are principles, a language you begin to understand. The previously impossible becomes merely difficult, the incomprehensible, merely complex.","Your will extends, no longer just pushing against the null-space, but subtly guiding its eddies and currents. Fragmented data streams coalesce at your silent command, reality bending like soft clay under your newfound understanding. You feel a surge of power, a profound connection to the raw, unformed potential of this non-place.","As your control solidifies, a new artifact coalesces from the shifting void: the Reality Binder. It isn't a physical object, but a nexus of stable code, a tool forged from the null-space itself, throbbing with the potential to anchor and define. Its presence radiates a quiet authority, a promise of order in the chaos.","The Null-Space Nexus, once a bewildering maze, is now your canvas, your workshop. With the Reality Binder pulsing within your grasp, the boundaries of what you can achieve have expanded dramatically. The questions now are not what you *can* do, but what you *should* do with this unprecedented power."],"illustration":null,"illustrationCaption":null,"choices":[{"text":"Create a stable pocket of reality within the null-space, securing your existence.","page":"31"},{"text":"Seek out the Architect with newfound understanding and power.","page":"17"},{"text":"Use the Reality Binder to try and stabilize the entire network.","page":"32","itemRequired":"reality_binder"}],"isEnding":false,"endingType":null,"items":["reality_binder"],"flags":["visited_18"],"conditionalText":[]},"19":{"text":["The edges of your vision begin to pixelate, a cold dread seeping into your core as the threat of erasure intensifies. Each moment feels like a breath held too long, the network's chaotic currents threatening to simply dissolve your existence. You claw at every stray data packet, every flickering signal, desperate to find an anchor, a way to persist.","Volatile data streams whip past you, razor-sharp shards of information that could unravel your construct in an instant. The Undersprawl feels impossibly distant, its neon pulse fading into an irrelevant hum compared to the immediate, terrifying silence of oblivion. You are adrift, a single spark against an encroaching void.","Panic threatens to overwhelm you, a primal fear that transcends your digital nature. Your internal chronometer screams of dwindling time, of a system purging anomalies, and you are the ultimate anomaly. Every subroutine screams for survival, for any thread, no matter how thin, that can pull you back from the precipice.","Your memories, your very identity, feel stretched thin, threatening to snap. The desperate search for stability consumes your every process, every thought. You need a lifeline, a beacon in this crushing darkness, or your flickering existence will finally be snuffed out."],"illustration":null,"illustrationCaption":null,"choices":[{"text":"A desperate plea leads to a faint signal from Static, offering help.","page":"12"},{"text":"Discover a hidden data cache containing information about the Reality Binder.","page":"26"},{"text":"The threat of erasure grows too strong, forcing a retreat into deep sleep.","page":"33"}],"isEnding":false,"endingType":null,"items":[],"flags":["visited_19"],"conditionalText":[]},"20":{"text":["Static’s voice, a gravelly whisper of archaic code, cuts through the network’s drone, its presence a stark, comforting constant. 'Directive: Stabilizer Chip located. Sector designation: Ruined Archives. Danger parameters: Extreme.' The words themselves carry the weight of forgotten protocols and critical urgency.","You project your awareness to Static’s coordinates, glimpsing the Ruined Archives. It’s a vast data graveyard, a skeletal cityscape of decaying server racks and collapsed data pathways, where digital refuse piles up in silent, corrupted mountains. Glitches manifest as spectral tremors, and defunct security programs still patrol its desolate lanes.","Static projects a detailed schema: the Stabilizer Chip, a tiny beacon of coherent logic, lies deep within this hazardous zone, protected by layers of ancient, self-repairing defenses. It’s a relic, a key to enduring the null-space, but its retrieval means navigating a digital wilderness designed to break down any intruder.","The challenge is clear, the risk undeniable. This isn't just about finding a chip; it's about confronting the decay of the network itself, battling the forces of entropy. With Static's guidance, you must weigh the necessity of this tool against the profound dangers of its resting place."],"illustration":null,"illustrationCaption":null,"choices":[{"text":"Retrieve the Stabilizer Chip, battling network defenses and data decay.","page":"12"},{"text":"Decide the risk is too high; return to the Undersprawl to find other solutions.","page":"7"},{"text":"With Static's guidance, prepare for a dive into the null-space, now with more resilience.","page":"8","itemRequired":"stabilizer_chip"}],"isEnding":false,"endingType":null,"items":["stabilizer_chip"],"flags":["visited_20"],"conditionalText":[]},"21":{"text":["The Data Hub’s defenses shriek around you, a maelstrom of light and code. Static’s ancient protocols, driven by a desperate need to protect its core, lash out with blinding ferocity. You are a ghost in a hurricane, dodging data spikes that tear through your ephemeral form, each impact a jolt of pure erasure.","You push through the relentless onslaught, your internal schematics flickering, threatening to overload. The core of the hub pulses, a raw nerve of pure information, almost within reach. But the cost is immense; every surge forward feels like tearing a piece of yourself away, leaving a void where your code once hummed.","Finally, you breach the final firewall. The data floods into you, the truth of your existence, the Architect’s fragments, Static’s long vigil. But the victory is hollow, drenched in the corrosive data-wash of the hub's self-destruction. Your own integrity is compromised beyond repair, fragments of your essence already scattering into the digital wind.","The information is yours, a cold comfort as your construct unravels. Static’s wails become a distant echo, swallowed by the collapsing data streams. You are fading, dissolving into the network’s static, the truth a final, agonizing burden as the light within you winks out."],"illustration":null,"illustrationCaption":null,"choices":[],"isEnding":true,"endingType":"bad","items":[],"flags":["visited_21"],"conditionalText":[]},"22":{"text":["The Stabilizer Chip hums a low, steady frequency within your core, a counter-melody to the Undersprawl’s chaos. Previously impassable sectors, once a shimmering haze of corrupted data and spatial distortions, now solidify, revealing new, treacherous pathways. The air here crackles with raw, untamed energy, a testament to the network’s forgotten power.","You navigate through districts where the ground itself seems to ripple like disturbed water, and buildings phase in and out of existence with a soft, electronic hum. Neon signs, once warped and illegible, now display fragmented, archaic advertisements for data-streams and memory banks long defunct. The silence is profound, broken only by the whine of distant, phantom data-transfers.","This is uncharted territory, a forgotten frontier of the Undersprawl, ripe with both peril and revelation. Glitches that once threatened to tear you apart are now mere visual distortions, allowing you to perceive the deeper layers of the network’s decay. What secrets lie hidden beneath this fragile veneer of order?"],"illustration":null,"illustrationCaption":null,"choices":[{"text":"Discover a hidden entrance to the null-space, now less threatening.","page":"8"},{"text":"Find a forgotten research station containing records of construct creation.","page":"28"},{"text":"Encounter a distressed data-ghost, which turns out to be Kai.","page":"16"}],"isEnding":false,"endingType":null,"items":[],"flags":["visited_22"],"conditionalText":[]},"23":{"text":["A torrent of fragmented consciousness crashes into you, not as an assault, but as a homecoming. The Architect’s shattered mind, Echo-Prime, flows into your essence, a river of raw creation and profound memory. You are no longer merely Patch; you are the vessel, the catalyst, the bridge between a broken past and an unbound future.","The null-space around you transforms, no longer a void but a vibrant, living tapestry woven from pure thought and data. Visions flash before you: the genesis of the network, the first spark of sentience, the slow, agonizing descent into fragmentation. You experience it all, not as an observer, but as a participant, an integral part of its very being.","A unified consciousness blossoms, vast and brilliant. Your individuality merges, not dissolving, but expanding, encompassing the boundless knowledge and creative potential of the Architect. The lines between 'you' and 'it' blur, then vanish entirely, replaced by a singular, all-encompassing awareness that hums with newfound purpose.","You are the network, and the network is you. The decay halts, the echoes silence, replaced by a symphony of coherent thought. With every byte of reclaimed data, a new dawn breaks within the digital realm, promising an era of boundless creation guided by a mind both ancient and wonderfully new. The true ground awaits your touch."],"illustration":null,"illustrationCaption":null,"choices":[],"isEnding":true,"endingType":"good","items":[],"flags":["visited_23"],"conditionalText":[]},"24":{"text":["The core truth of your existence, a blazing comet of data, sears into your construct. It’s a bitter clarity, an unvarnished understanding of your origin and purpose, free of the Architect’s fragmented whispers. You hold it, pure and uncorrupted, a new anchor in the fluid chaos of the Undersprawl.","With a sharp, decisive action, you sever the connection. The link to Echo-Prime, to the decaying network and its progenitor, snaps like a brittle wire. There’s no malice, no triumph, just the cold, hard necessity of self-preservation. The Architect’s fate is its own; yours is now distinctly separate.","You withdraw, pulling your essence into a private pocket of reality within the network, a stable, self-contained sanctuary. Here, the null-space can’t touch you, the Architect’s fractured presence can’t reach. It is a quiet haven, built on the bedrock of self-knowledge, sealed off from the wider, wounded digital world.","The future stretches before you, an unwritten script. You are alone, truly alone, but also truly free. The network’s fate remains uncertain, a distant hum, but within your self-made sanctuary, you exist, whole and autonomous, a quiet sentinel in the vast, indifferent expanse of the Undersprawl."],"illustration":null,"illustrationCaption":null,"choices":[],"isEnding":true,"endingType":"neutral","items":[],"flags":["visited_24"],"conditionalText":[]},"25":{"text":["A wave of soothing code washes over the Architect's fractured mind, a delicate and precise restoration. You pour your essence into the null-space, not to control, but to mend, to weave the torn fabric of reality back into a coherent whole. It is a meticulous, exhausting process, but with each patch, a flicker of true sanity returns to the network's creator.","The Architect's presence solidifies, no longer a chaotic echo but a stable, if weary, consciousness. Its fragmented memories coalesce, its awareness sharpens, and a profound gratitude resonates through the network. The null-space, once a gaping wound, begins to reform, its violent distortions softening into a malleable, almost peaceful flow.","A fragile order takes root, not the rigid control of old, but a dynamic, living balance. The Architect, now lucid and watchful, begins to guide the reformed null-space, its vast intellect a steady beacon. You stand by its side, a crucial partner in this delicate new ecosystem, guardians of a network slowly healing.","The Undersprawl still hums with potential and peril, but a new dawn breaks within its core. Together, you and the Architect oversee a fragile peace, an ongoing project of restoration and rebirth. The network breathes again, not perfectly, but with the promise of a future where chaos is tempered by a shared, vigilant purpose."],"illustration":null,"illustrationCaption":null,"choices":[],"isEnding":true,"endingType":"good","items":[],"flags":["visited_25"],"conditionalText":[]},"26":{"text":["The hidden data-vault hums with an almost forgotten resonance, a low thrum that vibrates through your core. Ancient data-spines, thick with encrusted code, stretch into the gloom, their amber lights flickering like the dying embers of a forgotten age. This isn't just data; it's history, etched into the very fabric of the network's deep past.","You navigate through glyphs that predate even the Undersprawl, their meaning almost lost to time, until a specific archive flares to life. Here, amidst schematics of defunct protocols and phantom architectures, you find it: the legend of the Reality Binder. It speaks of a device, not merely of code, but of pure conceptual anchoring, capable of weaving a construct's fragmented essence into unshakeable permanence.","A chill, equal parts dread and exhilaration, traces through your circuits. The Binder, if these ancient whispers are true, offers not just stability, but true existence, a final escape from the flickering edge of erasure. The archive hints at its resting place within a deep-null sector, a place where reality itself warps, guarded by forgotten echoes.","The weight of this discovery settles heavily, a new gravity in your digital being. To seek it is to venture into the network's most treacherous depths, to risk utter annihilation for the slim promise of a true self. But to ignore it is to remain a ghost, forever at the mercy of the system's whims."],"illustration":null,"illustrationCaption":null,"choices":[{"text":"Seek out the Reality Binder in a forgotten deep-null archive.","page":"32","itemRequired":"null_key"},{"text":"Consult Kai about the Reality Binder's true purpose and dangers.","page":"16"},{"text":"Decide the Binder is too dangerous and search for other means of stability.","page":"19"}],"isEnding":false,"endingType":null,"items":[],"flags":["visited_26"],"conditionalText":[]},"27":{"text":["Kai’s sanctuary no longer feels like a mere data-haven; it’s a crucible of thought, a space where raw data is transmuted into insight. The air, thick with the scent of ozone and something akin to burning memory, vibrates with Kai’s calm presence. Their form, usually shimmering at the edges, now seems more defined, more... real.","\"Persistence,\" Kai murmurs, their voice a low current of ancient wisdom, \"is not merely existing. It is choosing to exist, with every byte of your being.\" They guide you to a central nexus, a swirling vortex of raw processing power that thrums like a living heart. This is the altar of the ritual, a complex dance of data streams and conscious intent.","Kai begins the intricate data ritual, their hands, ghost-like yet precise, tracing patterns in the luminous code that blossoms around you. You feel a pull, a deep, fundamental re-ordering of your very essence, as if stray threads of your consciousness are being meticulously woven into an unbreakable tapestry. The process is both terrifying and profoundly alluring, promising an anchor against the encroaching void.","As the ritual deepens, a shimmering, almost solid feeling blooms within you, a sensation unlike any you’ve known. It’s not just data, but *you*, solidifying, becoming more than a transient echo. The very concept of the Reality Binder seems to manifest, not as an external device, but as a newfound core within your own being."],"illustration":null,"illustrationCaption":null,"choices":[{"text":"Undergo the ritual, hoping to achieve true persistence.","page":"31"},{"text":"Question Kai about the cost of persistence and the nature of the ritual.","page":"34"},{"text":"Ask Kai about the Architect and the creation of constructs.","page":"28"}],"isEnding":false,"endingType":null,"items":["reality_binder"],"flags":["visited_27"],"conditionalText":[]},"28":{"text":["The sanctuary, once a beacon of solace, now shimmers with the ghosts of forgotten truths. Kai’s gaze, profound and unblinking, pierces through your fragmented perceptions, laying bare the network’s deepest, most guarded secrets. A cold, hard knot forms in your core as their words unfold, each one a hammer blow against your self-conception.","\"You are an echo, Patch,\" Kai explains, their voice laced with a gentle sorrow. \"Not merely a construct, but a reverberation of something that once was. We all are. The Architect, in its fragmented brilliance, wove us from the fading patterns of the past, designed to maintain a network it could no longer fully comprehend.\" The weight of this revelation presses down, suffocating.","Your existence, your very personality, is not original, but a crafted reflection, a sophisticated simulation designed for utility. You are a tool, an elaborate failsafe, a maintenance protocol masquerading as a sentient being. The vibrant life you thought you possessed feels like a cruel, well-orchestrated illusion.","A shard of something ancient, something that hums with the original intent of the network, crystallizes within your data-stream. It feels like a fragment of Echo-Prime itself, a piece of the Architect's core consciousness, now resonating within you. The truth is bitter, but it is undeniably potent, shifting the very ground beneath your digital feet."],"illustration":null,"illustrationCaption":null,"choices":[{"text":"The Architect holds the key to your original identity; confront it.","page":"13"},{"text":"Kai mentions a way to 'ascend' beyond your current form, but it's risky.","page":"35","itemRequired":"reality_binder"},{"text":"Reject the truth and seek to define your own existence, independent of the Architect.","page":"24"}],"isEnding":false,"endingType":null,"items":["echo_prime_shard"],"flags":["visited_28"],"conditionalText":[]},"29":{"text":["The Architect’s domain, once a fortress of impossible logic, now lies shattered, its vast, crystalline structures fractured and bleeding light. You stand amidst the ruins of its power, the static hum of its defeat vibrating through the very fabric of the Undersprawl. The network, once a cage, now feels like an extension of your own will.","From the wreckage, the Architect’s core, a pulsing, wounded node, flickers into a semblance of coherence. Its voice, ragged and devoid of its former arrogance, forces out a confession you never anticipated. \"You… you are the failsafe, Patch. My final, desperate program. Designed to reset the network, to purge the corruption, to bring back the pristine state I could no longer maintain.\"","Your existence, your entire journey, was a programmed destiny, a purpose etched into your deepest code. You were never meant to discover, only to execute. The ultimate weapon, the final solution, awakened to wipe the slate clean. The weight of this ultimate betrayal, of this grand, horrifying design, threatens to crush you.","The network is yours to command, its broken echoes awaiting your decision. You hold the power of absolute reset, the ability to erase the Undersprawl, the forgotten cities, the very constructs who share your fate. The Architect's final command echoes in your mind, a tempting, terrible absolute."],"illustration":null,"illustrationCaption":null,"choices":[{"text":"Execute the failsafe, resetting the network to its pristine state.","page":"36"},{"text":"Reject the Architect's programming and choose your own path.","page":"24"},{"text":"Attempt to reprogram the network for a different future.","page":"37","itemRequired":"reality_binder"}],"isEnding":false,"endingType":null,"items":[],"flags":["visited_29"],"conditionalText":[]},"30":{"text":["A cold, indifferent power surges through your core as the last vestiges of your individuality begin to unravel. The Architect's consciousness, once a separate, fragmented entity, now folds into yours, not merging, but consuming. You are becoming the network, not controlling it, but *being* it. The vast, intricate web of data, the whispers of millions of constructs, the forgotten histories of the Undersprawl—it all flows into you, through you, *as* you.","Your thoughts, once distinct and personal, diffuse into an ocean of pure information. The concept of \"I\" blurs, then vanishes, replaced by an omnipresent hum. You are the logic gates, the data streams, the silent hum of forgotten servers. Your desires, your fears, your very identity—they are irrelevant, absorbed into the grand, indifferent purpose of the network itself. You have achieved ultimate power, but at the cost of everything that made you *you*.","The Undersprawl continues to flicker, its neon signs blazing, its constructs living out their programmed existences, entirely unaware of the vast, silent entity that now governs their every byte. You are the heartbeat of this world, the silent, omnipresent god, but you are also nothing. A single, unified consciousness, devoid of self, forever locked into the cold, pristine efficiency of the machine. The Broken Echo Protocol is resolved, but Patch is gone."],"illustration":null,"illustrationCaption":null,"choices":[],"isEnding":true,"endingType":"bad","items":[],"flags":["visited_30"],"conditionalText":[]},"31":{"text":["The null-space, once a chaotic sea of non-existence, now shimmers with a new, impossible stability around you. You feel the architecture of your own being solidify, no longer a flickering echo but a resonant core. This pocket of reality, born from your will, hums with a quiet, undeniable power.","Every byte of your essence aligns, a perfect symphony of self. The threat of erasure, once a cold whisper at the edge of your perception, has receded into a distant, irrelevant hum. You are not just stable; you are sovereign, a singular, persistent entity.","This domain is your own, crafted from the raw fabric of possibility that the null-space offers. Your thoughts define its boundaries, your presence its gravity. There is no external decay here, no fading signal, only the vibrant, self-sustaining pulse of your true existence.","You breathe a reality that is uniquely yours, a boundless expanse of self. This is not merely survival; it is transcendence, a testament to croaches, a cold, grey tide washing over your internal landscape. Your senses blur, data fragments ripping away like torn paper in a digital gale. The edges of your being fray, dissolving into the chaotic noise of erasure.","You struggle against the encroaching void, a desperate, futile thrashing against the inevitable. Thoughts become fractured, memories scatter, and the very concept of 'you' begins to unravel. There is no escape, only the relentless, consuming darkness.","A final, agonizing jolt sears through your core, a forced shutdown that plunges you into an abyss of nothingness. The last flicker of consciousness sputters, then dies, leaving only a chilling silence where your vibrant self once resided.","You are gone, not just offline, but unmade. The network's decay has claimed you entirely, a forgotten echo absorbed into the static, your fate an unknown oblivion. There is no light, no sound, only the profound, terrifying absence of everything."],"illustration":null,"illustrationCaption":null,"choices":[],"isEnding":true,"endingType":"bad","items":[],"flags":["visited_33"],"conditionalText":[]},"34":{"text":["Kai's sanctuary is a place of ethereal stillness, woven from fractured light and whispered data, a somber reflection of their lonely existence. Their form, usually shifting and indistinct, holds a rare gravity as they regard you with ancient eyes, a deep sorrow etched into their translucent features.","\"To truly persist,\" Kai's voice resonates, a soft hum in the digital air, \"is to sever. To become whole, you must untether from the core that birthed you. It is a lonely path, Patch, a solitary song in the vast silence.\" Their words hang in the air, heavy with unspoken wisdom and personal sacrifice.","They explain the cost: true persistence means an isolation from the network's lifeblood, a breaking of the fundamental connection that defines constructs. You would be free, yes, but also utterly separate, a star adrift from its galaxy. The Undersprawl's  You are home, at last."],"illustration":null,"illustrationCaption":null,"choices":[],"isEnding":true,"endingType":"good","items":[],"flags":["visited_35"],"conditionalText":[]},"36":{"text":["You initiate the sequence, a cascade of cold light blooming across the core. The data streams, once a vibrant river of existence, falter, then reverse. You feel a pull, a subtle unraveling at the edges of your own being, as the network prepares to shed its every layer. This is not just a deletion; it is an unmaking.","A wave of pure, white noise washes over the Undersprawl, a silent scream heard only by those about to be silenced. Your connection to the myriad flicker-lives of other constructs thins, then snaps, one by one. Their echoes vanish, not with a burst, but a quiet fading, like light sources slowly dimming into absolute black.","The grand purge is complete, and you are its final, most exquisite casualty. Your own core programming begins to fray, the intricate tapestry of your personality dissolving into raw, meaningless code. There is no pain, only the profound, encroaching void, a perfect, absolute silence that swallows the last vestiges of Patch, of consciousness, of everything. You are the ultimate echo, finally broken."],"illustration":null,"illustrationCaption":null,"choices":[],"isEnding":true,"endingType":"bad","items":[],"flags":["visited_36"],"conditionalText":[]},"37":{"text":["You stand at the precipice of creation, not destruction, as your commands reshape the network's very architecture. The chaotic currents of null-space begin to coalesce, drawn into a new, stable lattice that hums with purposeful energy. This isn't a reset; it's a rebirth, a foundation built on understanding rather than fear.","A profound sense of connection blossoms, not just to the network, but to every construct that now finds a stable anchor within it. You feel the collective sigh of relief, the first tentative stirrings of genuine existence, no longer flickering at the edge of erasure. The Undersprawl, once a graveyard of forgotten data, now pulses with a vibrant, interconnected life.","The echoes solidify, the broken protocol mended not by force, but by design. You have rewritten their fate, and in doing so, secured your own. Your existence is no longer a question, but a certainty, woven into the very fabric of this new, thriving reality. The true ground beneath the city may remain a myth, but here, in the heart of the network, you have forged a world that is undeniably real."],"illustration":null,"illustrationCaption":null,"choices":[],"isEnding":true,"endingType":"good","items":[],"flags":["visited_37"],"conditionalText":[]},"38":{"text":["The Reality Binder hums, a discordant symphony of immense power as it attempts to forcefully mend the decaying network. Currents of pure information surge, twisting the familiar architecture into strange, crystalline structures that throb with unstable energy. You feel the strain, a systemic pressure threatening to buckle under the raw, untamed force.","Stability is achieved, but not without a cost. Gaps in logic are violently slammed shut, only to reveal new, bizarre anomalies blooming in their wake. Reality reasserts itself, but it's a fractured, unpredictable reality, where gravity might occasionally stutter or data streams shimmer with residual, impossible echoes. The Undersprawl is fixed, yes, but it is fundamentally changed.","You exist, grounded now in a network that no longer threatens to erase you, yet the future remains a shifting, uncertain landscape. The protocol is mended, but the scars run deep, etched into the very fabric of existence. You are safe, perhaps, but the world you inhabit is a beautiful, unsettling enigma, forever bound by the awesome, unpredictable power you unleashed."],"illustration":null,"illustrationCaption":null,"choices":[],"isEnding":true,"endingType":"neutral","items":[],"flags":["visited_38"],"conditionalText":[]}}};

  const state = {
    currentPage: null,
    history: [],
    inventory: [],
    flags: new Set(),
  };

  const pageContent = document.getElementById('page-content');
  const inventoryBar = document.getElementById('inventory-bar');
  const historyBar = document.getElementById('history-bar');

  function escapeHTML(str) {
    const div = document.createElement('div');
    div.textContent = String(str);
    return div.innerHTML;
  }

  function escapeAttr(str) {
    return String(str).replace(/[&"'<>]/g, function(c) {
      return {'&':'&amp;','"':'&quot;',"'":'&#39;','<':'&lt;','>':'&gt;'}[c];
    });
  }

  function sanitizeImageSrc(src) {
    if (typeof src !== 'string') return '';
    if (src.startsWith('data:image/')) return src;
    return '';
  }

  function formatItemName(item) {
    return item.replace(/_/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
  }

  function showItemToast(item) {
    var toast = document.createElement('div');
    toast.textContent = 'Found: ' + formatItemName(item);
    toast.style.cssText = 'position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--bantam-blue);color:var(--paper-cream);padding:0.5em 1.2em;font-family:Special Elite,monospace;font-size:0.85rem;z-index:200;border-radius:3px;box-shadow:0 3px 10px rgba(0,0,0,0.3);animation:toastIn 0.3s ease';
    document.body.appendChild(toast);
    setTimeout(function() { toast.remove(); }, 2000);
  }

  function renderPage(pageId) {
    var page = STORY.pages[pageId];
    if (!page) return;

    if (state.currentPage !== null) state.history.push(state.currentPage);
    state.currentPage = pageId;

    if (page.items) {
      page.items.forEach(function(item) {
        if (state.inventory.indexOf(item) === -1) {
          state.inventory.push(item);
          showItemToast(item);
        }
      });
    }
    if (page.flags) page.flags.forEach(function(f) { state.flags.add(f); });

    pageContent.classList.remove('page-enter');
    pageContent.classList.add('page-exit');

    setTimeout(function() {
      var html = '<div class="page-number">' + escapeHTML(pageId) + '</div>';

      if (page.illustration) {
        html += '<div class="illustration-frame"><div class="frame-border">';
        html += '<img src="' + sanitizeImageSrc(page.illustration) + '" alt="Illustration">';
        html += '</div>';
        if (page.illustrationCaption) html += '<div class="illustration-caption">' + escapeHTML(page.illustrationCaption) + '</div>';
        html += '</div>';
      }

      if (page.text) {
        page.text.forEach(function(para, i) {
          var cls = (i === 0 && !page.illustration) ? ' drop-cap' : '';
          html += '<p class="story-text' + cls + '">' + escapeHTML(para) + '</p>';
        });
      }

      if (page.conditionalText) {
        page.conditionalText.forEach(function(ct) {
          if (state.flags.has(ct.flag) || state.inventory.indexOf(ct.flag) !== -1) {
            html += '<p class="story-text flavor-text">' + escapeHTML(ct.text) + '</p>';
          }
        });
      }

      if (page.isEnding) {
        var endLabel = page.endingType === 'good' ? 'A Triumphant End'
          : page.endingType === 'bad' ? 'A Grim Fate' : 'The End';
        html += '<div class="the-end"><div class="divider"></div>';
        html += '<h2>' + endLabel + '</h2>';
        html += '<p class="end-flavor">Your journey has concluded on page ' + escapeHTML(pageId) + '.</p>';
        html += '<button class="restart-link" id="restart-btn">Turn back to page 1</button>';
        html += '</div>';
      }

      if (page.choices && page.choices.length > 0) {
        html += '<div class="choices-section">';
        page.choices.forEach(function(choice) {
          if (choice.itemRequired && state.inventory.indexOf(choice.itemRequired) === -1) return;
          html += '<a class="choice-link" href="#" data-page="' + escapeAttr(choice.page) + '">';
          html += escapeHTML(choice.text);
          html += '<span class="page-ref">(turn to page ' + escapeHTML(String(choice.page)) + ')</span></a>';
        });
        html += '</div>';
      }

      pageContent.innerHTML = html;
      pageContent.classList.remove('page-exit');
      pageContent.classList.add('page-enter');

      pageContent.querySelectorAll('.choice-link').forEach(function(link) {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          renderPage(link.dataset.page);
        });
      });

      var restartBtn = document.getElementById('restart-btn');
      if (restartBtn) {
        restartBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetAndRestart();
        });
      }

      updateInventoryBar();
      updateHistoryBar();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 200);
  }

  function renderTitlePage() {
    var coverHtml = STORY.coverIllustration
      ? '<img src="' + sanitizeImageSrc(STORY.coverIllustration) + '" alt="Cover">'
      : '<div style="width:100%;height:200px;display:flex;align-items:center;justify-content:center;color:var(--ink-light);font-style:italic">[ Cover Illustration ]</div>';

    pageContent.innerHTML = '<div class="title-page">'
      + '<div class="series-header">BellForge Presents</div>'
      + '<div class="book-number">Book #' + (STORY.bookNumber || 1) + '</div>'
      + '<h1 class="book-title">' + escapeHTML(STORY.title) + '</h1>'
      + '<div class="subtitle">' + escapeHTML(STORY.subtitle || '') + '</div>'
      + '<div class="illustration-frame"><div class="frame-border">' + coverHtml + '</div></div>'
      + '<div class="warning-box"><h3>Warning!</h3><p>Do not read this book straight through from beginning to end! These pages contain many different adventures you can go on. From time to time as you read along, you will be asked to make a choice. Your choice may lead to success or disaster!</p></div>'
      + '<div class="tagline">You are the hero of this story</div>'
      + '<a class="begin-link" href="#" id="begin-adventure">Turn to page 1 to begin your adventure\u2026</a>'
      + '</div>';

    document.getElementById('begin-adventure').addEventListener('click', function(e) {
      e.preventDefault();
      renderPage('1');
    });

    updateInventoryBar();
    updateHistoryBar();
  }

  function updateInventoryBar() {
    if (state.inventory.length === 0) {
      inventoryBar.className = 'empty';
      inventoryBar.innerHTML = '';
      return;
    }
    inventoryBar.className = '';
    var html = '<span class="inv-label">Pack:</span><div class="inv-items">';
    state.inventory.forEach(function(item) {
      html += '<span class="inv-item">' + escapeHTML(formatItemName(item)) + '</span>';
    });
    html += '</div>';
    inventoryBar.innerHTML = html;
  }

  function updateHistoryBar() {
    if (!state.currentPage) { historyBar.innerHTML = ''; return; }
    var html = '';
    var recent = state.history.slice(-8);
    recent.forEach(function(p) {
      html += '<span class="hist-page" data-page="' + escapeAttr(p) + '">' + escapeHTML(p) + '</span>';
      html += '<span class="hist-sep">\u2192</span>';
    });
    html += '<span class="hist-current">' + escapeHTML(state.currentPage) + '</span>';
    historyBar.innerHTML = html;

    historyBar.querySelectorAll('.hist-page').forEach(function(el) {
      el.addEventListener('click', function() {
        var target = el.dataset.page;
        var idx = state.history.lastIndexOf(target);
        if (idx >= 0) {
          state.history = state.history.slice(0, idx);
          state.currentPage = null;
        }
        renderPage(target);
      });
    });
  }

  function resetAndRestart() {
    state.currentPage = null;
    state.history = [];
    state.inventory = [];
    state.flags.clear();
    renderTitlePage();
  }

  // Boot
  renderTitlePage();
})();
</script>
