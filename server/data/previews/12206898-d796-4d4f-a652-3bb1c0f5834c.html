<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Veil-Stuck Sanctuary</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,sans-serif;background:#1a1a2e;color:#e0e0e0;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .container{max-width:500px;text-align:center;padding:2rem}
    h1{font-size:2rem;margin-bottom:0.5rem;color:#f0c040}
    .meta{opacity:0.7;margin-bottom:1.5rem}
    .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin:1.5rem auto;max-width:320px}
    .piece{aspect-ratio:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:0.7rem;opacity:0.5}
    .badge{display:inline-block;background:#f0c040;color:#1a1a2e;padding:2px 8px;border-radius:4px;font-size:0.75rem;margin-bottom:1rem}
    .note{margin-top:1.5rem;opacity:0.5;font-size:0.85rem}
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">JIGSAW PUZZLE — PREVIEW</div>
    <h1>Veil-Stuck Sanctuary</h1>
    <p class="meta">25 pieces · challenging · Pixel Art / Retro</p>
    <div class="grid">
      <div class="piece">1</div>
      <div class="piece">2</div>
      <div class="piece">3</div>
      <div class="piece">4</div>
      <div class="piece">5</div>
      <div class="piece">6</div>
      <div class="piece">7</div>
      <div class="piece">8</div>
      <div class="piece">9</div>
      <div class="piece">10</div>
      <div class="piece">11</div>
      <div class="piece">12</div>
      <div class="piece">13</div>
      <div class="piece">14</div>
      <div class="piece">15</div>
      <div class="piece">16</div>
      <div class="piece">17</div>
      <div class="piece">18</div>
      <div class="piece">19</div>
      <div class="piece">20</div>
      <div class="piece">21</div>
      <div class="piece">22</div>
      <div class="piece">23</div>
      <div class="piece">24</div>
      <div class="piece">25</div>
    </div>
    <p class="note">Full drag-and-drop puzzle engine coming soon</p>
  </div>
</body>
</html>
